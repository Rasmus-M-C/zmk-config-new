---
# Pinned to ZMK v0.3.0 (the release that introduced full-duplex wired split
# support). This predates the Dec 2025 Zephyr 4.1 board-revision rename, so
# the board name here is "nice_nano_v2" — NOT "nice_nano@2.0.0", which only
# applies when tracking a newer/main checkout.
include:
  - board: nice_nano_v2
    shield: corne_left
    # USB logging via build snippet (not just the Kconfig symbol) — see
    # corne_left.conf for why the plain Kconfig-only approach failed to build.
    snippet: zmk-usb-logging
  - board: nice_nano_v2
    shield: corne_right
  # Handy for un-pairing/resetting BLE bonds on the host-connected (central) half
  - board: nice_nano_v2
    shield: settings_reset