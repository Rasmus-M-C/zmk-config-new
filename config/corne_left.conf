# Corne LEFT (central) — diagnostic build with debug logging
# This file only applies to corne_left (per ZMK's config file naming rules).
# corne_right.conf has the matching non-logging settings.

# --- Debug logging to watch raw key events over USB serial ---
# Central only: CONFIG_ZMK_USB_LOGGING requires CONFIG_ZMK_USB=y, which
# Kconfig only permits on the split central role.
#
# NOTE: Only set CONFIG_ZMK_USB_LOGGING here — it already pulls in CONFIG_LOG
# and routes the console over USB CDC ACM on its own. Manually adding
# CONFIG_LOG=y on top of it causes Zephyr's Kconfig to default to the plain
# UART log backend instead (which nice_nano doesn't have wired up), producing
# a build error about a missing `zephyr,console` device.
CONFIG_ZMK_USB_LOGGING=y

# Bump ZMK's own log level to DEBUG so kscan/position events are printed,
# not just warnings/errors.
CONFIG_ZMK_LOG_LEVEL_DBG=y

# --- Split communication transport (kept disabled for now — see notes) ---
# CONFIG_ZMK_SPLIT_BLE=n
# CONFIG_ZMK_SPLIT_WIRED=y