# Corne LEFT (central) — diagnostic build with debug logging
# This file only applies to corne_left (per ZMK's config file naming rules).
# corne_right.conf has the matching non-logging settings.
#
# NOTE: USB logging itself is now enabled via the `zmk-usb-logging` snippet
# in build.yaml, not a Kconfig line here — see build.yaml for why. This file
# only needs to raise the log verbosity.

# Bump ZMK's own log level to DEBUG so kscan/position events are printed,
# not just warnings/errors.
CONFIG_ZMK_LOG_LEVEL_DBG=y

# --- Split communication transport (kept disabled for now — see notes) ---
# CONFIG_ZMK_SPLIT_BLE=n
# CONFIG_ZMK_SPLIT_WIRED=y